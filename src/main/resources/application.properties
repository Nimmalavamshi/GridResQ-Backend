spring.application.name=GridResQ

server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gridresq_db}

spring.datasource.username=${DB_USERNAME:root}

spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.sql.init.mode=never

gridresq.admin.setup-key=${ADMIN_SETUP_KEY:}

logging.level.org.springframework.security=TRACE

logging.level.org.springframework.security.authentication=TRACE

logging.level.org.springframework.security.authentication.dao=TRACE
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true