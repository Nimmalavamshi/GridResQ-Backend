# Application Configuration
spring.application.name=GridResQ

# Server Configuration
server.port=${PORT:8080}

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gridresq_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Database Initialization
spring.sql.init.mode=never

# Admin Setup Configuration
gridresq.admin.setup-key=${ADMIN_SETUP_KEY:}

# Session Cookie Configuration
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true

# Security Logging
logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.authentication=INFO
logging.level.org.springframework.security.authentication.dao=INFO